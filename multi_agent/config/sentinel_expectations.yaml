# ---------------------------------------------------------------------------
# 아티팩트 신선도 선언
#
# file_max_age_days   : mtime 기준 허용 지연
# content_max_age_days: 파일 내부 generated_at 기준 허용 지연 (없으면 mtime과 동일 취급)
# producer_scheduled  : 살아있는 스케줄러가 이 생산자를 호출하는가.
#                       false면 정체는 "고장"이 아니라 "은퇴"다 — 심각도를 낮춘다.
# ---------------------------------------------------------------------------
artifacts:

  # ===== 이번 사고의 핵심 2건 =====

  - path: runtime_state/reports/data_health/daily_backtest.jsonl
    cadence: every_trading_day
    file_max_age_days: 3
    content_max_age_days: 3
    producer: multi_agent/tools/emit_daily_backtest.py
    producer_scheduled: true
    producer_call_site: "multi_agent/tools/run_daily_ops.sh:471"
    env_guard: {name: AG_DRIFT_ALERT_ENABLE, default: "1"}
    severity: critical
    baseline_state:
      last_modified: "2026-05-06T17:00"
      age_days_at_baseline: 100.3
      rows: 7
      all_rows_dated: "2026-05-06"
      finding: >
        스케줄 실행으로 성공한 적이 0건이다. 스텝이 스크립트에 추가된 게 2026-05-09
        (커밋 0fd8f28)인데 데이터는 05-06자뿐 — 데이터가 스텝보다 3일 앞선다.
        구 로그(04-04~06-09)에 emit_daily_backtest 문자열 0회.
      pending_verification: true
      expected_after_fix: "1회 실행당 3행 append (segment 1 + picked 2), dry-run 실측"
    # ⚠️ 되살아나도 내용은 retrain_v2_report.json(39일 정체)에서 파생된다.
    # 그래서 content 검사를 upstream으로 위임한다.
    content_derives_from: runtime_state/reports/learning/retrain_v2_report.json

  - path: runtime_state/reports/learning/daily_model_foundation_gate.json
    cadence: every_trading_day
    file_max_age_days: 3
    producer: multi_agent/tools/report_daily_model_foundation_gate.py
    producer_scheduled: true
    producer_call_site: "multi_agent/tools/run_daily_ops.sh:479"
    env_guard: {name: AG_DAILY_MODEL_FOUNDATION_GATE_ENABLE, default: "1"}
    severity: critical
    baseline_state:
      last_modified: "2026-06-09T01:31"
      age_days_at_baseline: 66.9
      cause: "run_daily_ops.sh:471 크래시의 하류 (479줄)"
      fixed_by: "cef135c"
      pending_verification: true

  # ===== 학습 사슬 =====

  - path: runtime_state/reports/learning/retrain_v2_report.json
    cadence: weekly
    file_max_age_days: 10
    content_max_age_days: 10       # 내부 generated_at 검사 필수
    producer: multi_agent/tools/run_learning_cycle.py
    producer_scheduled: true
    severity: critical
    baseline_state:
      last_modified: "2026-07-07T00:47"
      content_generated_at: "2026-07-03T09:52"
      age_days_at_baseline: 38.9
      cause: "학습주기 high-water 역전으로 61일간 재학습 없음"
    downstream: [runtime_state/reports/data_health/daily_backtest.jsonl]

  - path: runtime_state/long_term/learning/training_state.json
    cadence: daily
    file_max_age_days: 2
    severity: critical
    # 신선도가 아니라 정합성 검사가 본체다.
    integrity_checks:
      - name: high_water_not_above_sample
        rule: "last_nightly_resolved_total <= current_total_resolved"
        baseline_violation: {counter: 8180, sample: 4125, ratio: 1.98}
      - name: weekly_high_water_not_above_sample
        rule: "last_weekly_resolved_total <= current_total_resolved"
        baseline_violation: {counter: 8180, sample: 3960, ratio: 2.07}
      - name: train_recency
        rule: "now - last_weekly_train_at <= 21 days"
        baseline_violation: {last_weekly_train_at: "2026-06-14", days: 61}
    expected_after_fix:
      field: counter_rebaselined_from
      appears_in: runtime_state/reports/learning/learning_cycle_nightly.json
      value: 8180
      when: "첫 nightly 실행 (2026-08-14 23:50)"
      note: "이 필드가 안 찍히면 ede9706 수정이 안 먹은 것이다. 해당 주기는 여전히 skip이 정상."

  - path: runtime_state/reports/learning/learning_cycle_nightly.json
    cadence: daily
    file_max_age_days: 2
    severity: high

  - path: runtime_state/reports/learning/learning_cycle_weekly.json
    cadence: weekly
    file_max_age_days: 9
    severity: medium

  # ===== 게이트 =====

  - path: runtime_state/reports/validation/research_recursion_gate_latest.json
    cadence: every_trading_day
    file_max_age_days: 3
    producer: multi_agent/tools/report_research_recursion_gate.py
    producer_scheduled: true
    producer_call_site: "multi_agent/tools/run_daily_ops.sh:430"   # 크래시(471) 상류라 살아있었다
    severity: high
    baseline_state:
      last_modified: "2026-08-14T20:51"
      verdicts:
        b_all_top10:        {verdict: DEGRADE,   n: 400, fwd_ev: -1.61, ci: [-2.89, -0.33], since: "2026-08-03"}
        b_primary_top3:     {verdict: DEGRADE,   n: 58,  fwd_ev: -2.61, ci: [-7.62, 2.29],  since: "2026-08-03"}
        kospi_intraday_t5:  {verdict: DEGRADE,   n: 42,  fwd_ev: -0.60, ci: [-3.64, 2.10],  since: "2026-08-03"}
        swing_candidate:    {verdict: DEGRADE,   n: 161, fwd_ev: -0.60, ci: [-2.14, 0.95],  since: "2026-08-03"}
        nasdaq_session_tape: {verdict: DEGRADE,   n: 39,  fwd_ev: -0.41, ci: [-3.19, 2.33],  since: "2026-08-06"}
        kosdaq_intraday_t10: {verdict: OBSERVING, n: 7,   fwd_ev: 6.69,  ci: [-0.97, 12.02], since: "2026-08-03"}
    # 판정 변화 감시: 다음 관측에서 위 verdict와 달라지면 보고 대상.
    watch: {type: verdict_diff, against: baseline_state.verdicts}
    known_issue: >
      DEGRADE 규칙이 forward 점추정 부호만 본다. 위 5개 DEGRADE 중 CI가 완전히 0 미만인
      것은 b_all_top10 하나뿐 — 나머지 4개는 통계적으로 0과 구분 불가다. 소표본에서
      노이즈로 발화하는 구조이며, DEGRADE 전이 시 bd 티켓을 자동 발행한다
      (report_research_recursion_gate.py:_bd_create) -> 오탐이 티켓 스팸이 된다.
    field_semantics_warning: >
      fwd_win은 진짜 승률이 아니다. evaluate()에서 (net수익 > 0.3)의 비율로 계산되며 0.3은
      레인 비용과 무관한 하드코딩 상수다. expect_win은 각 레인 백테스트의 자체 승률 정의라
      정의가 다르다 -> 두 값을 그대로 빼면 안 된다. 2026-08-14 실측으로는 b_all_top10에서
