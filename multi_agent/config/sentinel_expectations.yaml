# ---------------------------------------------------------------------------
# 레인 발화 빈도 자격 (OD-31). 새 유형이다.
#
# 위의 artifacts 는 "파일이 신선한가"를 묻는다. 여기는 "레인이 매 거래일 픽을
# 내놓는가"를 묻고, 미달이면 경보가 아니라 **사이징을 막는다**(OD-7/OD-33).
#
# OD-31: 느린 레인은 경보 대상이 아니라 자격 미달이다. 유예를 주지 않는다.
# 근거 실측: orca/reports/audit-observing-duration-goblin.md (2026-08-17, goblin)
#
# 2026-08-16 초판의 OD-28 방아쇠 3종(A 상대 2.0배 / B 절대 60영업일 /
# C 생산정지 10영업일)은 OD-31 로 **전부 폐기**됐다. 되살리지 말 것.
# A/B 는 "느린 레인일수록 유예가 길어지는" 설계 자체가 거부된 것이고,
# C 는 아래 자격 규칙이 더 빠르게(3거래일) 흡수했다.
#
# 판정 규칙 (mtime_is_meaningless 와 같은 자리의 함정들):
#
#   firing_is_production_not_maturation
#     발화는 픽 도착일이다. 정산 완료일(settled_at)로 재면 hold_days 만큼 뒤로
#     밀려 최근 생산일이 통째로 빠진다. b_shadow 의 픽 날짜는 scan_date 이며
#     settled_at 이 아니다 — 초판이 여기서 틀렸다.
#
#   denominator_is_trading_days_not_weekdays
#     월~금을 분모로 쓰면 휴장일이 결석으로 잡힌다. 실측에서 2026-06-30 ·
#     2026-07-17 은 KR 두 레인이 동시에 비어 있어 휴장이지 결함이 아니었다.
#     휴일표를 코드에 박지 말고 데이터에서 유도한다(아래 trading_calendar).
#
#   suspended_lanes_are_exempt_not_failing
#     의도적으로 정지된 레인(AG_B_ENGINE_SCAN=0 등)을 발화율로 판정하면
#     OD-14 와 같은 오류다 — 정지 이후 표본으로 정지 레인을 판정하는 것.
#     면제하되 suspension_age 경보를 함께 둔다. 면제만 두면 정지가 판정도
#     자격심사도 없는 영구 은신처가 된다(OD-17 이 막은 구멍의 정지축 재발).
#
#   qualification_blocks_it_does_not_warn
#     자격 미달은 사이징 0 이다(OD-7/OD-33). 경보를 울리고 기다리는 게 아니다.
#     초판이 전부 경보였던 것이 OD-31 이 지적한 느슨함의 정체다.
#
#   both_od1_axes_or_the_number_is_wrong
#     OD-1 은 n>=30 AND 고유일>=20 이다. n축만 세면 과소추정한다. kosdaq 실측:
#     n축 103영업일 대 고유일축 180영업일로 1.7배 차이 — n_min 을 채워
#     OBSERVING 을 벗어나는 시점에도 OD-1 자격은 없다.
# ---------------------------------------------------------------------------
lane_firing_qualification:
  decision: OD-34            # 채택됨 2026-08-17 (제안 근거 OD-31)
  related: [OD-1, OD-2, OD-7, OD-14, OD-33, OD-35, OD-36]
  supersedes_in_ledger: "OD-26 은 OD-36 으로 거둬짐 — kosdaq 예외 없음"
  source_report: orca/reports/audit-observing-duration-goblin.md
  action: block_sizing        # 경보 아님. OD-7/OD-33 집행.
  gate_output: runtime_state/reports/validation/research_recursion_gate_latest.json

  criterion:
    metric: firing_rate
    numerator: "픽이 도착한 거래일 수"
    denominator: "레인 자기 시장의 거래일 수"
    window_trading_days: 10
    floor: 0.80               # = 8/10
    derivation: "floor = 20 / W_판정,  W_판정 = 25거래일(5주)"
    derivation_basis: >
      20 은 OD-1 고유일 요건(고정). 25거래일은 정상 코호트의 판정 도달 실측
      기간(24~27영업일)의 중앙값. 따라서 문턱은 "정상 레인이 실제로 걸리는
      시간 안에 판정에 도달하라"이며 정상의 배수가 아니라 정상 그 자체다.
    grace: "첫 픽 이후 10거래일 미만이면 판정 보류(신규 레인 보호)"
    exempt_if: "게이트 산출의 suspended_since 가 non-null — 단 OD-35 기한 있음"

  # OD-36 귀결: 자본 배분이 붙는 레인이 0개다. 픽 표시는 관측 전용으로 남는다.
  # 판정기 주의 — "사이징 레인 0"은 이 시점의 정상 상태이지 고장이 아니다.
  # 어떤 레인이든 사이징이 0 아닌 값으로 돌아오면 그것이 자격 통과를 뜻하므로
  # 근거(발화율 + 게이트 판정)를 함께 확인한다.
  capital_allocation_lanes: 0

  trading_calendar:
    method: derive_from_data   # 휴일표를 박지 않는다
    KR: "union(kospi_intraday_t5, swing_candidate) 발화일"
    US: "nasdaq_session_tape 자기 발화일 — 2번째 US 레인이 없어 독립 검증 불가(한계)"
    exclude: "당일(미완결)"
    note: "B 레인(b_shadow)은 6자리 종목코드 = KR 시장이다. KR 달력을 쓴다."

  baseline_state:
    measured_at: 2026-08-17
    window: "각 레인 첫 픽 .. 2026-08-14"
    lanes:
      kospi_intraday_t5:    {fired: 36, trading_days: 36, rate: 1.000, verdict: PASS}
      swing_candidate:      {fired: 30, trading_days: 30, rate: 1.000, verdict: PASS}
      nasdaq_session_tape:  {fired: 31, trading_days: 31, rate: 1.000, verdict: PASS}
      kosdaq_intraday_t10:  {fired: 5,  trading_days: 34, rate: 0.147, verdict: FAIL,
                             sizing: 0, note: "OD-36 으로 OD-26 예외 거둬짐"}
      b_primary_top3:       {suspended_since: 2026-08-03, verdict: EXEMPT,
                             od35_deadline: 2026-08-31}
      b_all_top10:          {suspended_since: 2026-08-03, verdict: EXEMPT,
                             od35_deadline: 2026-08-31}
    finding: >
      운영 3개 레인의 결석은 통틀어 0일(97 레인-일). 정상은 "대부분의 날"이
      아니라 "매 거래일"이다. rule of three 로 참 결석률 95% 상한 3.1%.
      kosdaq 은 6.8배 아래이며 Wilson 95% 상한(0.280)조차 운영 코호트
      하한(0.886)에 못 미친다 — 두 집단은 표본오차로 겹치지 않는다.
    correction_of_initial_report: >
      초판의 "정상 75~83%"는 세 오염의 합이었다 — 성숙일을 셈 / 월~금을
      분모로 씀 / 정지된 B 레인 2개를 코호트에 포함. 셋을 고치면 1.000 이다.

  historical_replay:
    method: "실제 발화 이력에 이동창 규칙을 매 거래일 재적용"
    floor: 0.80
    results:
      W10: {kospi: "0/27 fail", swing_candidate: "0/21 fail", nasdaq: "0/22 fail",
            kosdaq: "first_fail 2026-07-10, 25/25 fail"}
      W15: {kospi: "0/22 fail", swing_candidate: "0/16 fail", nasdaq: "0/17 fail",
            kosdaq: "first_fail 2026-07-20, 20/20 fail"}
      W20: {kospi: "0/17 fail", swing_candidate: "0/11 fail", nasdaq: "0/12 fail",
            kosdaq: "first_fail 2026-07-27, 15/15 fail"}
    conclusion: >
      세 창 모두 오탈락 0건이고 kosdaq 을 100% 탈락시킨다. 차이는 속도뿐이라
      최단 W=10 을 채택. kosdaq 탈락일 2026-07-10 은 폐기된 B 방아쇠
      예상일(2026-09-18)보다 70일 빠르고 측정일 기준 이미 38일 전이다.
    sensitivity: >
      문턱 0.5~0.9, 창 10~20 어디로 흔들어도 판정이 바뀌지 않는다. 운영 3개는
      최소 1.000, kosdaq 은 최대 0.147, 그 사이에 아무 레인도 없다.

  subsumes:
    - id: production_stall
      note: >
        발화율 1.000 레인이 멈추면 연속 3거래일 결석에 7/10=0.70 으로 탈락한다.
        폐기된 C 방아쇠(10영업일)보다 7거래일 빠르다. 별도 정지 감시 불필요.

  alerts:   # 자격이 구조적으로 표현할 수 없는 것만 남긴다
    - id: qualification_transition
      severity: warn
      condition: "발화율 자격이 PASS -> FAIL 로 바뀔 때"
      rationale: >
        차단은 자동으로 일어나지만 이유가 보이지 않으면 안 된다. 사이징이 조용히
        0 이 되고 아무도 모르는 상태는 이 리포의 반복 실패다(suspend_marker_broken
        아무도 안 읽음, F1 한 경로에만 배선). 행위가 아니라 가시성을 위한 경보.

    - id: suspension_age
      severity: alert
      decision: OD-35
      condition: "suspended_since 경과 > 20거래일"
      threshold_trading_days: 20
      threshold_basis: >
        운영자 결정 2026-08-17. 정상 레인의 판정 도달 기간(25거래일)보다 짧게
        잡았다 — 정지가 working 레인을 판정하는 시간보다 오래 가면 안 된다.
        실측 근거는 없다(정지 이력 1건이라 코호트 불가). goblin 은 OD-5/OD-30
        원칙에 따라 수치를 지어내지 않고 비워 올렸고 운영자가 정했다.
      on_fire: "해제할지 폐기할지 운영자 결정 — 자동 처리 금지"
      escalate_to: orca-worker-fleet-infra
      # 기한이 차면 exempt 가 자동 만료된다. 만료 후에도 정지가 유지되면
      # 그 레인은 면제 없이 OD-34 판정을 받는다(발화 0 -> 미달 -> 사이징 0).
      exempt_expires_at_deadline: true

  retired_triggers:   # OD-31 로 폐기. 되살리지 말 것.
    - {id: observing_slower_than_own_throughput, was: "elapsed > 2.0 x D_exp",
       why_retired: "느린 레인일수록 유예가 길어지는 설계 자체가 거부됨(OD-31)"}
    - {id: observing_absolute_exposure_cap, was: "elapsed > 60 bd",
       why_retired: "정상 코호트가 24~27영업일인데 kosdaq 에 12주를 더 주는 셈(OD-31)"}
    - {id: observing_production_stall, was: "no new row > 10 bd",
       why_retired: "자격 규칙이 3거래일에 흡수 — subsumes.production_stall"}

  # ---- 활성 추적: OD-35 기한 임박 -------------------------------------------
  active_deadlines:
    - id: b_lane_suspension_od35
      lanes: [b_primary_top3, b_all_top10]
      suspended_since: 2026-08-03
      suspension_reason: "PKG-A 중지 (§40 CI<0 확정). AG_B_ENGINE_SCAN 기본값 0."
      market: KR                    # 6자리 종목코드
      deadline_trading_days: 20
      elapsed_confirmed: 9          # 데이터 유래 KR 달력, 2026-08-14 까지
      deadline_estimate: 2026-08-31
      deadline_uncertainty: >
        2026-08-17 이 KR 휴장이면 2026-09-01 로 하루 밀린다. 이 날짜를 하드코딩하지
        말고 데이터 유래 KR 달력(union kospi|swing_candidate)에서 매일 재계산할 것.
        광복절(08-15 토) 대체휴일 가능성이 있으나 데이터로 확정하지 못했다.
      on_fire: "orca-worker-fleet-infra 에 보고. 해제/폐기는 운영자 결정."
      status: tracking

  open_questions:     # 채택 후 남은 것만
    - "마커 없이 사실상 멈춘 레인의 기본값(현재: 면제 아님 = 미달). 안전한 방향이라 판단해 이렇게 뒀다."

  resolved_questions:
    - {q: "문턱 0.80 / 창 10거래일", a: "채택 — OD-34"}
    - {q: "OD-2 와의 관계", a: "OD-34 가 '기존 3조건을 건드리지 않는 새 축이며 엄격화 아님'으로 판단"}
    - {q: "suspension_age 임계값", a: "20거래일 — OD-35"}
    - {q: "kosdaq OD-26 예외", a: "거둠 — OD-36. 재검토(OD-32) 종결, 대상 소멸."}

  out_of_scope:
    - lanes: [nasdaq_session_edge, nasdaq_swing, b_market_neutral, swing_ensemble]
      reason: "UNGATED_PUBLISHED_LANES. OD-17 로 이미 발행 불가. 발화율 미측정."
      # 지금은 무영향이나, 어느 하나라도 게이트에 배선되면 그 시점에 발화율이 필요하다.
      # 배선은 GATE_LANE_MAP 에 항목이 생기는 것으로 감지된다.
      trigger_to_measure: "modules/stream_exclusion.py 의 GATE_LANE_MAP 에 해당 레인이 추가될 때"
      what_is_needed: >
        측정 방법은 baseline_state 와 동일하다 — 픽 날짜 필드로 발화일을 세고
        자기 시장 거래일을 분모로 쓴다. b_shadow 처럼 픽 날짜 필드가 settled_at 이
        아닌 경우가 있으므로 원장별 필드를 먼저 확인할 것(firing_is_production_not_maturation).
      status: recorded_not_measured

  handed_off:         # 내 소관 아님 — 소유자에게 이관됨
    - {id: verdict_since_restamped_by_migration, owner: anglerfish,
       where: "report_research_recursion_gate.py:155-157,269-271",
       note: "상태파일 dict 마이그레이션이 부분적(swing_ensemble 만 bare string)이라
              전 레인이 2026-08-03 으로 재스탬프. 지속 기간으로 쓸 수 없다."}
    - {id: observing_in_healthy_verdicts, owner: seaslug, decision: OD-33,
       where: "modules/stream_exclusion.py:123,249",
       note: "HEALTHY_VERDICTS 에 OBSERVING 포함 -> excluded = not healthy.
              미판정이 사이징으로 흐른다. OD-33 으로 차단 결정."}

# ---------------------------------------------------------------------------
# kosdaq_intraday 조기 재검토 (OD-32) — 종결됨
#
# OD-36 으로 OD-26 예외가 거둬져 재검토 대상 자체가 소멸했다. 이 절은 감시
# 항목이 아니라 근거 보존이다 — 판정기는 읽지 않는다.
# kosdaq_intraday_t10 은 이제 lane_firing_qualification 의 일반 판정을 받는다
# (발화율 0.147 -> 미달 -> 사이징 0).
#
# 지우지 않는 이유: DECISIONS.md 규칙 2("지우지 않는다 — 왜 뒤집혔는지가 남아야
# 같은 논의를 두 번 하지 않는다"). 이 리포의 반복 사고가 값의 출처가 사라지는
# 것이었다. OD-36 의 근거 수치가 여기 있다.
# ---------------------------------------------------------------------------
kosdaq_early_review:
  decision: OD-32
  status: CLOSED                 # OD-36 으로 예외 거둬짐 (2026-08-17)
  closed_by: OD-36
  outcome: "예외 회수. 재검토 대상 소멸. 이 절은 근거 보존용."
  monitoring: none               # 판정기가 읽을 활성 항목 아님
  exception_under: "OD-26 (OD-36 으로 대체됨)"
  measured_at: 2026-08-17
  firing_rate: 0.147
  disqualified_since: 2026-07-10   # OD-31 문턱 적용 시. 측정일 기준 38일 전.
  never_recovered: "25/25 평가 전부 미달"
  od1_projection:
    unique_days_now: {production: 5, matured: 4}
    to_20_unique_production: {trading_days: 102, date: 2027-01-06, weeks: 20}
    to_20_unique_matured: {trading_days: 109, date: 2027-01-15, weeks: 22}
    axis_note: "n축 103영업일 < 고유일축 180영업일 — n_min 채워도 그 시점에 OD-1 자격 없음"
  sample_quality:
    matured_net_after_cost_0_33: [9.67, 9.67, 9.67, -16.90, 9.67, 15.03, 10.03]
    at_touch_cap: "4/7 이 정확히 상한 9.67"
    finding: >
      승리는 계약이 만든 상한값이고 손실은 잘리지 않는다(유일 손실 -16.90).
      RESEARCH_STANDARDS §4 의 출구계약 비대칭 전형. OD-26 한계 명시와 일치.
  exposure_window:
    stated_in_od26: "약 10주"
    measured: "2026-06-26 .. 2027-01-15, 약 29주"
    ratio: 2.9
  what_i_do_not_decide: >
    OD-26 예외의 유지/회수는 운영자 결정이며 권고하지 않는다. 다만 OD-26 은
    "판정이 가능해질 때까지"라는 조건부 예외였고, 실측상 그 조건은 2027-01
    이전에 충족되지 않는다. 유지한다면 10주가 아니라 29주 예외를 승인하는 것이다.

# ---------------------------------------------------------------------------
# 스케줄 드리프트 감시: plist ProgramArguments 진입점이 실재하고 이 리포로 수렴하는가.
# ---------------------------------------------------------------------------
schedule_drift:
  launch_agents_glob: "~/Library/LaunchAgents/com.codex.swing.*.plist"
  expected_count: 11
  resolver:
    launcher: "~/Library/Application Support/CodexSwing/bin/codex_swing_launch.sh"
    root_file: "~/Library/Application Support/CodexSwing/project_root"
    expected_root: /Users/dongdong/Projects/codex_swing/swing-main
    # launcher는 root_file이 AGENTS.md+requirements.txt 검증에 실패하면 조용히
    # 후보 경로로 넘어간다. 어느 경로로 해석됐는지를 기록해야 드리프트가 보인다.
    fallback_candidates:
      - ~/Projects/codex_swing/swing-main
      - ~/Desktop/codex_swing/swing-main
      - ~/codex_swing/swing-main
  checks:
    - name: entrypoint_exists
      rule: "모든 plist의 ProgramArguments[0]이 실재"
      baseline: {pass: 11, total: 11}
    - name: single_repo_convergence
      rule: "모든 잡이 expected_root로 수렴"
      baseline: {pass: 11, total: 11}
    - name: no_external_volume_root
      rule: "해석된 root가 /Volumes/ 아래면 안 된다 (언마운트 시 전 잡 조용사)"
      baseline: {pass: true}
      note: >
        /Volumes/ORICO/quant_pj1 은 실재하는 별개 프로젝트다(AGENTS.md 보유). 즉 고아 래퍼가
        가리키는 경로는 깨진 게 아니라 살아 있다 -> 누가 plist를 거기로 돌리면 실제로 동작하고,
        볼륨 언마운트 시 조용히 전멸한다. "경로가 없어서 안전"이 아니라는 점이 중요하다.

  # 실행 중인 스크립트 편집 위험. 실제로 한 번 사고가 났다(2026-07-08 rc=127).
  live_edit_hazard:
    target: multi_agent/tools/run_daily_ops.sh
    why: >
      dailyops가 StartInterval 300s로 이 스크립트를 상시 실행한다. bash는 스크립트를 바이트
      오프셋으로 이어 읽기 때문에 실행 중 파일이 바뀌면 새 파일의 엉뚱한 위치에서 재개해
      단어 조각을 명령으로 해석한다. 2026-07-08 stderr에 "line 237: eady: command not found"
      (eady = 단어 중간 조각) + "line 15: Terminated: 15" 가 동시에 찍힌 게 그 증거다.
    detect: {pattern: "command not found", in: launchd_primary_market_session_ops.err.log}
    mitigation_note: "편집은 임시파일에 쓰고 mv로 원자적 교체하면 회피된다 (운영자 판단)"

