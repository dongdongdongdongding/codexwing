# 관측 기준선. 판정기는 이 값과 현재를 비교해 "새로 나빠졌는지"를 본다.
baseline:
  observed_at: "2026-08-14T23:28:00+09:00"
  observer: goblin
  note: >
    이 시점에 5개 수정(cef135c/9b1410b/ede9706/221ac63/532c921)이 17:41~17:58에
    커밋됐고 터널을 제외하면 스케줄 검증 전이다. 첫 무인 실행은 이 미검증 상태를
    기준선으로 삼되, 아래 pending_verification 항목은 별도로 판정해야 한다.

# ---------------------------------------------------------------------------
# 달력: 거래일 정의. every_trading_day 판정에 쓴다.
# ---------------------------------------------------------------------------
calendar:
  # ⚠️ 예측을 적을 때 이 절을 먼저 볼 것. 2026-08-15 예측 실패의 직접 원인이 이걸 무시한 것이다
  # (금요일 증분 +31을 토요일에 외삽). 표본 증가·정산·발행은 전부 거래일에만 일어난다.
  # 실측 주말 ΔRESOLVED = [0, 0, 2] — 임계 20을 넘은 적이 없다.
  prediction_rule: "다음 실행일이 거래일인지 먼저 확인하고, 임계 초과는 확률(과거 N/M)로 적는다"
  trading_days: [mon, tue, wed, thu, fri]
  # 한국 공휴일 미반영. 공휴일에는 오탐이 난다 — 판정기가 KRX 캘린더를 붙이기
  # 전까지는 grace_hours로 흡수한다.
  holidays_source: null
  weekend_expected_idle: true

# ---------------------------------------------------------------------------
# launchd 잡. 로그 목적지가 5곳으로 흩어져 있어 전부 열거한다 (§4.4).
# ---------------------------------------------------------------------------
jobs:

  - label: com.codex.swing.dailyops
    schedule: {type: interval, seconds: 300}
    stdout: "~/Library/Application Support/CodexSwing/logs/ops/launchd_primary_market_session_ops.log"
    stderr: "~/Library/Application Support/CodexSwing/logs/ops/launchd_primary_market_session_ops.err.log"
    log_format: concatenated_json
    # exit code는 무의미하다. 로그 본문의 세션 report.status를 본다.
    success_check:
      type: json_stream_field
      # due_count>0 인 실행만 채점 대상. due_count==0은 "발화 안 함"이지 실패가 아니다.
      filter: "due_count > 0"
      field: "reports[].status"
      expect: "ok"
      fail_values: ["failed"]
    expected_fires_per_trading_day: {min: 2, max: 4}
    severity: critical
    baseline_state:
      window: "2026-06-08 .. 2026-08-14"
      fired: 154
      succeeded: 0
      failed: 154
      cause: "run_daily_ops.sh:471 DRIFT_ARGS[*]: unbound variable (bash 3.2, set -u)"
      fixed_by: "cef135c @ 2026-08-14 17:41"
      pending_verification: true
    alert_if:
      - "consecutive_failures >= 2"
      - "no_fire_during_trading_day"

  - label: com.codex.swing.learning.nightly
    schedule: {type: calendar, hour: 23, minute: 50}
    stdout: "~/Library/Application Support/CodexSwing/logs/learning/nightly_learning.log"
    stderr: "~/Library/Application Support/CodexSwing/logs/learning/nightly_learning.err.log"
    log_format: json_tail
    # 실행됨 != 학습함. action=skip이 9주간 조용한 실패였다.
    success_check:
      type: json_field
      field: action
      expect_not: skip
      # 단 skip 자체가 항상 이상은 아니다 — 신규 표본이 정말 없으면 정상이다.
      # 그래서 "연속 skip 일수"로 판정한다.
    severity: critical
    baseline_state:
      last_actual_train: "2026-06-14"
      consecutive_skips_days: 61
      cause: "training_state.json high-water 8180 vs 표본 4125 역전"
      fixed_by: "ede9706 @ 2026-08-14 17:49"
      pending_verification: true
    alert_if:
      - "consecutive_skip_days >= 10"

  - label: com.codex.swing.learning.weekly
    schedule: {type: calendar, weekday: 7, hour: 9, minute: 0}
    stdout: "~/Library/Application Support/CodexSwing/logs/learning/weekly_learning.log"
    stderr: "~/Library/Application Support/CodexSwing/logs/learning/weekly_learning.err.log"
    log_format: json_tail
    success_check: {type: json_field, field: action, expect_not: skip}
    severity: high
    baseline_state: {consecutive_skips_weeks: 9, pending_verification: true}
    alert_if: ["consecutive_skip_weeks >= 3"]

  - label: com.codex.swing.investor-estimate
    schedule: {type: calendar, times: ["10:03", "11:33", "13:23", "14:33"]}
    stdout: "~/Library/Logs/codex_swing/investor_estimate.out.log"   # 소문자 트리
    stderr: "~/Library/Logs/codex_swing/investor_estimate.err.log"
    log_format: jsonl
    # written==41 로는 부족하다. ok==written 이어야 한다 (§5.3).
    success_check:
      type: jsonl_field
      require: "ok == written and ok > 0"
      ignore_rows: ['{"skip": "weekend"}']   # 주말 skip은 정상
    expected_rounds_per_trading_day: 4
    severity: high
    baseline_state:
      window: "2026-08-04 .. 2026-08-14"
      rounds: 36
      ok: 28
      failed: 8
      cause: "2026-08-04~05 KISOpenAPIError: Missing KIS_APP_KEY or KIS_APP_SECRET"
      self_recovered: "2026-08-06"
    alert_if: ["any_round_with ok == 0"]

  - label: com.codex.swing.kr-daily-auto-scan
    schedule: {type: calendar, hour: 9, minute: 35}
    stdout: "~/Projects/codex_swing/swing-main/runtime_state/discord_jobs/kr_daily_auto_scan.out.log"
    stderr: "~/Projects/codex_swing/swing-main/runtime_state/discord_jobs/kr_daily_auto_scan.err.log"
    severity: high
    baseline_state: {window: "2026-08-03 .. 2026-08-14", days_ran: 12, days_expected: 12}

  - label: com.codex.swing.kr-premarket-theme-prior
    schedule: {type: calendar, hour: 8, minute: 20}
    stdout: "~/Projects/codex_swing/swing-main/runtime_state/discord_jobs/kr_premarket_theme_prior.out.log"
    stderr: "~/Projects/codex_swing/swing-main/runtime_state/discord_jobs/kr_premarket_theme_prior.err.log"
    severity: medium
    # ⚠️ 판정기 주의: 산출 파일명이 UTC다 (08:20 KST -> ...T232011Z 전일자).
    # 날짜 문자열 매칭으로 판정하면 매일 오탐이 난다. 실제로 한 번 낚였다.
