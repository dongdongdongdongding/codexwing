# ---------------------------------------------------------------------------
# 재개봉 조건 (OD-51) — 킬 기준의 거울상.
# 등록이 없으면 누군가 "표본 쌓였으니 다시 켜자" 로 되살린다. 재개봉은 "표본이 쌓이면"이
# 아니라 **"측정 자체가 유효해지면"** 이다.
# ---------------------------------------------------------------------------
  # ── 2026-08-20 anglerfish 등록 ──────────────────────────────────────────────
  # 최종 목표(75% 정확도 / 15%+ 수익)까지 **가장 짧은 경로**로 실측된 건.
  # 등록 이유: n 도달 후에 기준을 정하면 눈대중이 된다. 도달 전에 박아 둔다.
  - id: swing_kosdaq_top1_depth_verdict
    source: "anglerfish 실측 2026-08-20 (kr_swing_candidate_ledger n=188 채점행, 같은날 p랭킹)"
    prose: >
      스윙 KOSDAQ top-1 선별이 발행 가능한 EV 를 갖는가.
      실측(2026-08-20): n=26 · EV +2.39 · 승률 84.6% · CI(-0.87, 5.08) — CI 가 0 을 포함해 판단 불가.
      같은 조건 KOSPI 는 EV -0.62 로 음수이며 **표본으로 해결되지 않는다** — 두 시장을 섞으면
      필요 n 이 46 에서 405 로 늘어난다(혼합이 신호를 죽인다). 그래서 시장별로 나눠 등록한다.
    kind: one_shot
    status: pending
    severity: warn
    precondition:
      desc: "KOSDAQ top-1 채점행 46건 (부트스트랩 CI 하한이 0 을 넘기는 데 필요한 n)"
      met: false
      # raw 행수(225)로 세면 46 을 넘어 거짓으로 열린다 — 유도 계수를 쓴다
      check:
        type: top1_scored
        file: runtime_state/reports/experimental/kr_swing_candidate_ledger.jsonl
        market: KOSDAQ
        score_field: p
        outcome_field: policy_ret
        min: 46
      measured_2026_08_20:
        rows_now: 26
        ev: 2.39
        win_pct: 84.6
        ci: [-0.87, 5.08]
        sd: 8.20
        required_n: 46
        firing_days: 26
    adjudication_record: "RESEARCH_LOG.md 스윙 선별깊이 판정 서술 + adjudications.jsonl"
    criterion_at_termination: >
      n>=46 시점에 **아래 셋을 모두** 통과해야 승격을 올린다. 하나라도 실패하면
      선별깊이 가설을 기각하고 스윙 레인 재연구로 돌린다.

      (1) EV: 부트스트랩 CI 하한 > 0.
      (2) 플라시보: 같은날 무작위 1건 대비 p-value < 0.05.
      (3) 방향성: 같은날 p 최상위 - 최하위 스프레드의 CI 하한 > 0.

      **모든 CI 는 블록 부트스트랩(L=5)으로 낸다. 단순 부트스트랩·부호검정 금지.**
      보유 5일이 겹쳐 날짜가 독립이 아니다. 2026-08-20 실측에서 순진한 부호검정은
      p=0.00016 을 냈지만 겹침을 반영하면 CI 가 0 을 포함하고, 5일 간격 독립 부분표본에서는
      5/6 승리 p=0.109 로 유의하지 않다. 유효 표본은 27 이 아니라 약 6 이다.

      **(2)(3) 이 핵심이다.** 2026-08-20 실측에서 (1) 만으로는 부족함이 드러났다 —
      p 최상위 EV +2.39 인데 **최하위가 +2.18** 이고 스프레드는 +0.21, CI(-4.78, 4.35) 로
      0 을 포함한다. 무작위 대비 p-value 도 0.109 로 0.05 를 넘는다.
      즉 지금 수치는 "우리 모델이 잘 고른다"가 아니라 "KOSDAQ 후보가 오른다"와 구분되지 않는다.
      (1) 만 걸면 최하위 픽도 통과시키는 기준이 된다.

      **주의**: 승률로 승격하지 않는다. 84.6%가 목표 75%를 넘는다는 이유는 근거가 못 된다 —
      승률이 높고 EV 가 음수인 것이 현행 계약의 실패 형태다(승률 69.3% / EV -0.94).
    narrowing: >
      순환논증 금지: 이 등록의 근거가 된 n=26 측정은 판정의 입력이지 결론의 근거가 아니다.
      추가 20건은 **새 데이터**여야 하며 같은 26건을 재채점해 n 을 늘리지 않는다.
    notes: >
      **표본 누수는 이 판정을 위협하지 않는다(실측 정정).** KOSDAQ top-1 발화 32일 중
      누수 0건 — 미채점 6건은 전부 정상 숙성(1~9일)이다. 003680 누수는 KOSPI 쪽이고
      임계 경로 밖이다. 처음에 "누수가 판정을 무기한 밀린다"고 적었는데 크기를 재지 않은
      과장이었다. 003680 수리는 여전히 필요하나 이 관문의 선행조건은 아니다.
      투고: investigate-003680-unresolved-anglerfish.md

      **아직 안 한 필수 검정: 시장중립.** +2.39 가 KOSDAQ 상승 베타인지 확인하지 않았다.
      원장에 보유창 지수수익이 없어 별도 결합이 필요하다. 승격 전 반드시 선행한다 —
      down_edge_was_beta_correction 이 정확히 이 누락으로 났다.

  # ── 2026-08-20 anglerfish 등록: 출구폭 단일 가설 ────────────────────────────
  # 격자에서 최댓값을 고르지 않았다. +20%/10일이 EV +5.85 로 가장 높지만 n=22 에
  # 10칸 격자는 과적합이고 승률이 59.1%로 목표(75%) 아래로 떨어진다.
  # 현행 +5% 에서 **한 칸** 인접한 +7%/5일만 단일 가설로 등록한다.
  - id: swing_kosdaq_exit_width_7pct
    source: "anglerfish 백테스트 2026-08-20 (fdr 정본, 전건 재현 188/188)"
    prose: >
      스윙 KOSDAQ top-1 의 익절폭을 +5% -> +7% (보유 5일 유지)로 넓히면 EV 가 개선되는가.
      실측: EV +2.48 -> +3.33, 승률 85.2% -> 81.5%(목표 75% 유지),
      같은날 유동성매칭 유니버스 대비 초과 +2.07 -> +2.90.
      **스톱은 이미 기각됐다** — 6수준 전부 EV 악화, -3%에서 74% 발동(승자를 죽인다).
    kind: one_shot
    status: pending
    severity: warn
    precondition:
      desc: "KOSDAQ top-1 채점행 46건 (블록 부트스트랩 CI 하한이 0 을 넘기는 데 필요한 n)"
      met: false
      check:
        type: top1_scored
        file: runtime_state/reports/experimental/kr_swing_candidate_ledger.jsonl
        market: KOSDAQ
        score_field: p
        outcome_field: policy_ret
        min: 46
      measured_2026_08_20:
        n: 27
        ev_5pct: 2.48
        ev_7pct: 3.33
        win_5pct: 85.2
        win_7pct: 81.5
        excess_7pct: 2.90
        excess_ci_block_L5: [-1.35, 5.94]
        excess_ci_naive: [-0.37, 6.08]
        sign_test_naive_p: 0.00016
        independent_subsample: "5/6 승리 p=0.109"
        effective_n_estimate: 6
    adjudication_record: "RESEARCH_LOG.md 출구폭 판정 서술 + adjudications.jsonl"
    criterion_at_termination: >
      n>=46 에서 **+7% 의 시장중립 초과**(같은날 유동성매칭 유니버스에 같은 계약 적용)의
      **블록 부트스트랩(L=5) CI 하한 > 0** 이면 계약 변경을 운영자에게 올린다.
      넘지 못하면 +7% 가설을 기각하고 현행 +5% 를 유지한다.

      **금지**: 격자 재탐색으로 다른 칸을 고르지 않는다. 이 등록은 +7%/5일 단일 가설이다.
      +10%/+15%/+20% 가 더 좋아 보여도 그것은 n=22~27 격자의 최댓값이지 발견이 아니다.
      **금지**: 승률로 판정하지 않는다. 익절을 넓힐수록 승률은 내려간다(85.2->59.1).
    narrowing: >
      순환논증 금지: 이 등록의 근거인 n=27 백테스트는 판정의 입력이지 결론의 근거가 아니다.
      추가 19건은 새 데이터여야 한다.
      벤치마크 주의: 처음에 exec_5d(단순보유)로 재서 초과를 +0.82 로 과소평가했다.
      계약 효과와 선별 효과가 섞이므로 **유니버스에 같은 계약을 적용**해야 한다.
    notes: >
      데이터 정본은 fdr 이다. ohlc_full.parquet 은 쓰지 마라 —
      커버리지 937종목(채점종목 22개 결측), px_long 과 종가 40.2%만 일치(수정주가 기준 상이).
      재현 검증 없이 돌리면 전부 헛수치다.
      투고: backtest-exit-policy-anglerfish.md · measure-alpha-vs-criteria-anglerfish.md

  # ── 2026-08-20 anglerfish 등록: 두 번째 KR 레인 ─────────────────────────────
  # 깊이 렌즈가 독립된 두 KR 레인에서 재현됐다. 격자 최댓값이 아니라 사전 고정 렌즈의 재현이다.
  - id: kospi_intraday_top1_market_neutral
    source: "anglerfish 실측 2026-08-20 (렌즈 29개 스윕 + 유동성매칭 유니버스 대조)"
    prose: >
      kospi_intraday_t5 를 top-1 로 자르면 시장중립 초과가 확인되는가.
      전체 EV +0.11 -> top-1 +2.11 (승률 75.8%). 같은날 유동성매칭 KOSPI 유니버스
      (144종목/일)에 같은 계약(+5% 터치/5세션, 종가진입) 적용 시 유니버스 +0.51,
      **초과 +1.61**.
      swing KOSDAQ 에서 같은 렌즈가 +2.39(전체 -0.08)로 나왔다 — **두 KR 레인 재현**.
      NASDAQ(top-1 -0.65)과 b레인(rank<=1 -2.29)에서는 반대다.
    kind: one_shot
    status: pending
    severity: warn
    precondition:
      desc: "KOSPI top-1 채점행 49건 (iid 가정에서도 CI 하한이 0 을 넘기는 데 필요한 n)"
      met: false
      check:
        type: top1_scored
        file: runtime_state/reports/experimental/kospi_intraday_swing_ledger.jsonl
        market: KOSPI
        score_field: p
        outcome_field: exit_t5_h5
        min: 49
      measured_2026_08_20:
        n: 33
        pick_ev: 2.12
        universe_ev: 0.51
        excess: 1.61
        excess_sd: 5.72
        ci_iid_L1: [-0.29, 3.54]
        ci_block_L5: [0.24, 3.18]
        ci_block_L2_to_L10: "전부 0 제외"
        lag1_autocorr: -0.345
        independent_subsample: "6/7 승리 p=0.0625"
        win_days: "23/33"
    adjudication_record: "RESEARCH_LOG.md kospi_intraday 깊이 판정 서술 + adjudications.jsonl"
    criterion_at_termination: >
      n>=49 에서 **iid 부트스트랩(L=1) CI 하한 > 0** 이면 승격을 올린다.
      넘지 못하면 기각한다.

      **왜 가장 보수적인 L=1 을 기준으로 두는가**: 현재 블록 CI(L=2~10)는 전부 0 을
      제외하지만, 그것은 lag-1 자기상관 -0.345 를 신뢰한 결과다. n=33 에서 자기상관의
      표준오차는 약 0.17 이라 -0.345 는 2SE 남짓 — 노이즈일 수 있다.
      음의 자기상관이 진짜면 유효표본이 커져 유리한 방향인데, **유리한 쪽 가정에
      기대어 승격하지 않는다.** L=1 이 통과하면 어떤 가정에서도 통과한다.
    narrowing: >
      순환논증 금지: n=33 측정은 판정의 입력이지 결론의 근거가 아니다. 추가 16건은 새 데이터.
      다중검정 고지: 이 레인은 **29개 렌즈 스윕에서 나왔다.** 양수쪽으로 CI 가 0 을 제외한
      칸은 그 29개 중 0개였고, 이 발견의 근거는 개별 유의성이 아니라 두 레인 재현이다.
      승격 판정은 그 사실을 알고 해야 한다.
    notes: >
      진입가 근사: 원장의 entry_reference_price(15:00)와 당일 종가의 괴리는 중앙 0.000%,
      75%가 0.5% 이내다. 픽·유니버스 **양쪽 모두 종가 진입**으로 계산해 대조를 대칭으로 맞췄고,
      그 방식으로 원장 재현 48/48(중앙오차 0.000)을 확인했다.
      투고: sweep-all-lanes-edge-anglerfish.md

prereg_reopen_conditions:
  - id: kr_ranking_shadow_reopen
    source: "docs/research/KILL_KR_RANKING_SHADOW_2026-08.md §4"
    applies_to: kr_ranking_shadow
    all_required: true
    conditions:
      - id: R1
        prose: "채점 지표를 fwd5_cc(원시 종가수익) → 시장초과 net 으로 교체"
        met: false
        why_critical: >
          원시수익으로는 베타와 선별을 영원히 못 가른다. **이 조건 없이는 표본을 아무리
          쌓아도 무의미하다** — R1 미충족 상태의 축적이 재개봉을 영원히 만족시키지 못한다.
      - {id: R2, prose: "고유 정산일 >= 20", observed: 4, need: 20, met: false}
      - {id: R3, prose: "서로 다른 시장국면 >= 2개 (반등장 단일창 금지)",
         observed: {regimes: [down_chop, up], count: 2}, met: true, provisional: true,
         caveat: "킬 문서가 '시장국면'의 소스를 지정하지 않았다 — 소스 확정은 운영자 몫"}
      - {id: R4, prose: "같은날 대조 + 랜덤티커 플라시보 동반", machine_readable: false,
         why: "방법 요건 — 절차라 산출물로 확인 불가(OD-51 명시)"}
      - {id: R5, prose: "재판정 시 심도 단조성 = 상관 <= -0.15 且 날짜클러스터 블록CI 상한 < 0",
         met: false, note: "점추정 부호로는 불충분 — 사전등록 방향으로의 재입증"}
    reopen_is_not_publication: >
      R1~R5 를 전부 통과해도 "다시 연구할 수 있다"는 뜻이며 발행/라우팅 금지는 별도 승인
      없이 해제되지 않는다.

