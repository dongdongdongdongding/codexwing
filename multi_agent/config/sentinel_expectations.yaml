# multi_agent/config/sentinel_expectations.yaml
#
# 2026-08-17 OD-40: orca_pj/orca/sentinel/expectations.yaml 에서 이 위치로 옮겼다.
#   판정기(multi_agent/tools/report_sentinel_expectations.py)가 리포 안에서 돌기 때문에
#   리포 밖 절대경로에 의존하면 다른 클론·CI 에서 깨진다.
#
# 원래 헤더:
# sentinel/expectations.yaml
#
# "이 아티팩트는 이 주기로 갱신돼야 한다"의 선언적 표. 무인 판정 스크립트가 읽는다.
#
# 작성: goblin (ops), 2026-08-14 23:28 KST
# 근거: reports/ops-sweep.md
#
# 설계 원칙 (전부 실제 사고에서 나옴):
#  1. mtime만 보면 안 된다. investor_estimate는 2일간 매일 mtime을 갱신하면서
#     328행 전부 오류를 썼다 (ops-sweep §5.3). -> content 검사를 별도로 선언한다.
#  2. exit code를 믿으면 안 된다. dailyops는 LastExitStatus=0이면서 154/154 실패했다
#     (§1.2). run_optional()이 실패를 [WARN]으로 삼키고 성공을 반환한다.
#     -> 로그 본문의 status 필드를 판정 근거로 쓴다.
#  3. "파일이 새것"과 "내용이 새것"은 다르다. daily_backtest.jsonl은 곧 mtime이
#     갱신되지만 내용은 39일 묵은 retrain 리포트에서 파생된다 (§5.2).
#     -> content_max_age를 file_max_age와 분리한다.
#  4. 좀비 로그의 mtime은 영구 오탐이다 (§4.5). -> ignore로 명시 격리한다.
#  5. 정체가 곧 고장은 아니다. 생산자가 은퇴했으면 정체가 정상이다.
#     -> producer_scheduled 필드로 "고장"과 "은퇴"를 갈라 적는다.
#  6. 디렉토리를 최신 파일로 대표시키지 않는다. us_research 를 그렇게 판정해 🟢 0.0일로
#     통과시켰는데, 매일 갱신되는 tape_ledger 가 7주 정지한 edge_ledger 를 가리고 있었다.
#     건강한 형제 파일 하나가 죽은 파일 전부를 가린다 (trace-nasdaq-edge-stall.md §4.2).
#  7. mtime이 아무 정보도 주지 않는 파일이 있다. 생산자가 신규 없이도 전량 재기록하면
#     mtime은 매일 새것이 되고 내용은 몇 주째 그대로다. mtime_is_meaningless: true 로 표시하고
#     행수·최대일로 판정한다 (§4.3). 이 조합 자체가 이상 신호다 -> watch_patterns 참조.

# 감시 패턴: 개별 파일 규칙으로는 안 잡히는 이상 조합
watch_patterns:
  - id: ledger_rewritten_without_append
    rule: "mtime 은 갱신되는데 행수·max(date) 가 불변인 원장"
    why: >
      write_ledger() 류가 append 0건에도 전량 재기록하면 신선도 감시가 영구 통과한다.
      nasdaq_session_edge_operational_ledger 가 이 방식으로 7주를 숨었다.
    action: "해당 원장의 생산자 로그에서 ledger_appended 추이를 확인"
  - id: sibling_masking
    rule: "디렉토리 판정이 초록인데 내부에 개별 정체 파일이 있는 경우"
    action: "*_ledger.jsonl / *_latest.json 은 반드시 파일 단위로 판정"

version: 1
timezone: Asia/Seoul
